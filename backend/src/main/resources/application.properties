spring.application.name=Cricket Scorecard App

server.port=8080

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:cricket.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret Key (min 256 bits / 32 chars)
jwt.secret=harsh-shringi-cricket-scorecard-app-secret-key-12345
jwt.expirationMs=86400000

# SQL init (Initialize tables via schema.sql)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
